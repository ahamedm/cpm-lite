AuditEvent:
  type: object
  description: >
    Append-only audit record. before_state/after_state are redacted snapshots;
    financial payloads and tokens must never be stored here.
  required:
    - audit_event_id
    - occurred_at
    - actor_subject
    - action
    - entity_type
    - entity_id
    - correlation_id
  properties:
    audit_event_id:
      type: string
      format: uuid
    occurred_at:
      type: string
      format: date-time
    actor_subject:
      type: string
    actor_department_code:
      type: [string, 'null']
    action:
      type: string
      examples: ['scenario_version.submitted', 'submission.approved', 'plan_version.published']
    entity_type:
      type: string
      enum: [model, model_version, scenario, scenario_version, job, rule, rule_version, submission, promotion, plan, plan_version]
    entity_id:
      type: string
      format: uuid
    entity_version:
      type: [integer, 'null']
    correlation_id:
      type: string
    request_id:
      type: [string, 'null']
    before_state:
      type: [object, 'null']
      additionalProperties: true
    after_state:
      type: [object, 'null']
      additionalProperties: true
    metadata:
      type: [object, 'null']
      additionalProperties: true
