openapi: 3.1.0
info:
  title: CPM Lite Thin Orchestrator API
  version: 0.1.0
  description: |
    Contract for the Thin Layer API and orchestration service. This is a
    review draft: it defines the HTTP surface and resource model, not the
    implementation. It covers the model/scenario registry, job submission and
    status, rule validation hooks, review/promotion workflow, audit access and
    Cube schema-refresh signals.

    Conventions:
    - Base path: `/api/v1`; JSON only; UUIDs are strings.
    - Money and exact decimals are strings, never JSON floats.
    - Errors use RFC 9457 problem details with a stable `code`.
    - Mutable resources use `ETag`/`If-Match`; unsafe retryable POSTs require
      `Idempotency-Key`.
    - Async operations return `202` with a `Location` header.
  contact:
    name: CPM Lite Engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.cpm-lite.example
    description: Placeholder production host
tags:
  - name: Health
    description: Liveness and readiness probes for the orchestrator.
  - name: Identity
    description: The caller's effective identity and scope.
  - name: Reference
    description: Departments and cost centres used for scoping.
  - name: Models
    description: Model registry, versions, validation and publication.
  - name: Scenarios
    description: Scenario registry, versions, validation and results.
  - name: Jobs
    description: Asynchronous scenario job submission and monitoring.
  - name: Rules
    description: Versioned rules-as-data authoring and publication (phase 2).
  - name: Review
    description: Submission, steward decisions and promotion to a plan.
  - name: Plans
    description: Official plan and plan-version read model.
  - name: Audit
    description: Append-only audit trail access.
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [ok, degraded, unavailable]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Current principal and effective scope
      x-implementation-slice: 1
      responses:
        '200':
          description: Effective identity and scope derived from the token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/departments:
    get:
      tags: [Reference]
      operationId: listDepartments
      summary: List departments visible to the caller
      x-implementation-slice: 1
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Departments.
          content:
            application/json:
              schema:
                type: object
                required: [data, page_info]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
                  page_info:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/cost-centres:
    get:
      tags: [Reference]
      operationId: listCostCentres
      summary: List cost centres visible to the caller
      x-implementation-slice: 1
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: department_code
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Cost centres.
          content:
            application/json:
              schema:
                type: object
                required: [data, page_info]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CostCentre'
                  page_info:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/model-sources:
    get:
      tags: [Models]
      operationId: listModelSources
      summary: List governed sources available for model authoring
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      responses:
        '200':
          description: Governed sources with column profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSourceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/model-preview:
    post:
      tags: [Models]
      operationId: previewModel
      summary: Preview a draft model against its governed source
      description: >
        Executes a read-only aggregate query against the governed source with
        the caller's department scope. Only allowlisted source columns and
        aggregations are accepted; arbitrary expressions are rejected.
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPreviewRequest'
      responses:
        '200':
          description: Grouped preview rows and totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List model definitions
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: department_code
          in: query
          schema:
            type: string
        - name: visibility
          in: query
          schema:
            type: string
            enum: [department, global]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, updated_at, -updated_at]
            default: -updated_at
      responses:
        '200':
          description: Models.
          content:
            application/json:
              schema:
                type: object
                required: [data, page_info]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
                  page_info:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Models]
      operationId: createModel
      summary: Create a model and its first draft version
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreateRequest'
      responses:
        '201':
          description: Model created with a draft version.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/models/{model_id}:
    parameters:
      - $ref: '#/components/parameters/ModelId'
    get:
      tags: [Models]
      operationId: getModel
      summary: Get a model
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      responses:
        '200':
          description: Model.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Models]
      operationId: updateModel
      summary: Update model metadata
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdateRequest'
      responses:
        '200':
          description: Updated model.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags: [Models]
      operationId: archiveModel
      summary: Archive a model (no hard delete)
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, admin]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Archived model.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /api/v1/models/{model_id}/versions:
    parameters:
      - $ref: '#/components/parameters/ModelId'
    get:
      tags: [Models]
      operationId: listModelVersions
      summary: List model versions
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, validated, published, superseded]
      responses:
        '200':
          description: Model versions.
          content:
            application/json:
              schema:
                type: object
                required: [data, page_info]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelVersionSummary'
                  page_info:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Models]
      operationId: createModelVersion
      summary: Create a new draft model version
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelVersionCreateRequest'
      responses:
        '201':
          description: Draft model version.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/model-versions/{model_version_id}:
    parameters:
      - $ref: '#/components/parameters/ModelVersionId'
    get:
      tags: [Models]
      operationId: getModelVersion
      summary: Get a model version
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      responses:
        '200':
          description: Model version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Models]
      operationId: updateModelVersion
      summary: Update a draft model version
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelVersionUpdateRequest'
      responses:
        '200':
          description: Updated draft.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/model-versions/{model_version_id}/validate:
    parameters:
      - $ref: '#/components/parameters/ModelVersionId'
    post:
      tags: [Models]
      operationId: validateModelVersion
      summary: Validate a draft model version
      description: Runs structural and semantic checks; returns a report even when invalid.
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      responses:
        '200':
          description: Validation report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/model-versions/{model_version_id}/publish:
    parameters:
      - $ref: '#/components/parameters/ModelVersionId'
    post:
      tags: [Models]
      operationId: publishModelVersion
      summary: Publish a validated model version and request a Cube refresh
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Published; Cube refresh is asynchronous.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPublishResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/model-versions/{model_version_id}/refresh:
    parameters:
      - $ref: '#/components/parameters/ModelVersionId'
    post:
      tags: [Models]
      operationId: refreshModelVersionCube
      summary: Queue another Cube refresh for a published model version
      description: >
        Recovery path for a failed refresh. A pending refresh is coalesced, so
        repeated calls are safe. Publishing is not required and no new version
        is created.
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, data_engineer, admin]
      responses:
        '202':
          description: Refresh queued; the Cube refresh is asynchronous.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/scenarios:
    get:
      tags: [Scenarios]
      operationId: listScenarios
      summary: List scenarios
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: department_code
          in: query
          schema:
            type: string
        - name: scenario_type
          in: query
          schema:
            type: string
            enum: [budget, forecast]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, updated_at, -updated_at]
            default: -updated_at
      responses:
        '200':
          description: Scenarios.
          content:
            application/json:
              schema:
                type: object
                required: [data, page_info]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Scenario'
                  page_info:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Scenarios]
      operationId: createScenario
      summary: Create a scenario and its first draft version
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreateRequest'
      responses:
        '201':
          description: Scenario created with a draft version.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/scenarios/{scenario_id}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Scenarios]
      operationId: getScenario
      summary: Get a scenario
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, admin]
      responses:
        '200':
          description: Scenario.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Scenarios]
      operationId: updateScenario
      summary: Update scenario metadata
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, admin]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioUpdateRequest'
      responses:
        '200':
          description: Updated scenario.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags: [Scenarios]
      operationId: archiveScenario
      summary: Archive a scenario (no hard delete)
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, admin]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Archived scenario.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /api/v1/scenarios/{scenario_id}/versions:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Scenarios]
      operationId: listScenarioVersions
      summary: List scenario versions
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, validated, queued, running, completed, failed, cancelled]
      responses:
        '200':
          description: Scenario versions.
          content:
            application/json:
              schema:
                type: object
                required: [data, page_info]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScenarioVersionSummary'
                  page_info:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Scenarios]
      operationId: createScenarioVersion
      summary: Create a new draft scenario version
      x-implementation-slice: 1
      x-required-roles: [business_user, steward, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioVersionCreateRequest'
